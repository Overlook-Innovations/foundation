name: Tests

# The package's own unit tests, which the Upstream workflow is explicitly not a
# substitute for. That one asks whether the world still fits together and takes
# twenty minutes to answer; this one asks whether this package does what it says
# and answers in seconds, on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        # Laravel 11 is missing, though composer.json still allows it: every
        # 11.x release now carries an unpatched security advisory, so Composer
        # refuses to install one and the leg cannot be made to resolve at all.
        # Testing what the studio would actually deploy rather than turning the
        # audit off. If nothing is going to be built on 11 again, the constraint
        # in composer.json should be narrowed to match.
        laravel: ['^12.0', '^13.0']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      # The lower bound is tested as well as the upper, because the package
      # declares support for a range and only one end of it gets used in anger.
      - name: Install dependencies
        run: |
          set -euo pipefail
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run the tests
        run: vendor/bin/pest
